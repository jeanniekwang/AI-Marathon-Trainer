<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Marathon Trainer - Personalized Training Plans</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏃 AI Marathon Trainer</h1>
            <p class="subtitle">Create Your Personalized Training Plan</p>
        </header>

        <main>
            <form id="trainingForm">
                <div class="form-section">
                    <h2>Personal Information</h2>
                    
                    <div class="form-group">
                        <label for="gender">Gender:</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="age">Age:</label>
                        <input type="number" id="age" name="age" min="1" max="120" required>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Training Details</h2>
                    
                    <div class="form-group">
                        <label for="distance">Distance Training For:</label>
                        <select id="distance" name="distance" required>
                            <option value="">Select distance</option>
                            <option value="5k">5K</option>
                            <option value="10k">10K</option>
                            <option value="half-marathon">Half Marathon (21.1K)</option>
                            <option value="marathon">Marathon (42.2K)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="trainingDays">Training Days Per Week:</label>
                        <input type="number" id="trainingDays" name="trainingDays" min="1" max="7" required>
                        <small class="help-text">Recommended: <span id="recommendedDays">3-4 days</span></small>
                    </div>

                    <div class="form-group">
                        <label for="trainingDuration">Training Duration (months):</label>
                        <input type="number" id="trainingDuration" name="trainingDuration" min="1" max="12" step="0.5" required>
                        <small class="help-text">Recommended: <span id="recommendedDuration">1-4 months</span></small>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Generate Training Plan</button>
            </form>

            <div id="trainingPlan" class="training-plan hidden">
                <h2>Your Personalized Training Plan</h2>
                <div id="planContent"></div>
                <button id="printBtn" class="print-btn">Print Plan</button>
            </div>
        </main>

        <footer>
            <p>AI Marathon Trainer - Create personalized training plans based on your own data</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
